project_name: gpt2-test-large
save_dir: ${paths:EXPERIMENTS_DIR}/gpt2-test-large

seq_len: 256
vocab_size: 48004

tokenizer:
  path: ${paths:EXPERIMENTS_DIR}/gpt2-test-large/BPE_vocab_48k

model:
  vocab_size: ${..vocab_size}
  d_model: 256
  d_ff: 512
  n_heads: 8
  N: 12
  max_len: ${..seq_len}
  compile_model: True

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.01

checkpoint:
  enabled: false
  save_dir: ${..save_dir}
  save_top_k: 3
  save_last: true
  every_n_epochs: 1
  monitor: val_loss
  mode: min

early_stopping:
  enabled: false
  monitor: val_loss
  mode: min
  patience: 10

wandb:
  enabled: true
  project: gpt-test-large
  name: default

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: -1
  num_nodes: 1
  strategy: auto
  log_every_n_steps: 100
  check_val_every_n_epoch: 1
  early_stopping_patience: 5
  resume_from:

dataset:
  classla_v2_hr: ${paths:DATA_DIR}/gpt2-test-large/classla_v2_data.npy
  fineweb_edu: ${paths:DATA_DIR}/gpt2-test-large/fineweb-edu_data.npy
  seq_len: ${..seq_len}
  num_workers: 20
  batch_size: 32