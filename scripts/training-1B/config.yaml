project_name: 1B-model
save_dir: ${paths:EXPERIMENTS_DIR}/1B-model

seq_len: 1024
vocab_size: 48000 #this could be read from the tokenizer below

tokenizer:    # not used since the dataset is already pretokenized
  path: ${paths:EXPERIMENTS_DIR}/1B-model/hr_en_bs_tokenizer_48000

model:
  vocab_size: ${..vocab_size}
  seq_len: ${..seq_len}
  d_model: 1024
  d_ff: 2816
  n_heads: 16
  use_gqa: false
  gqa_factor: 2
  'N': 30
  p_dropout: 0.1
  pos_emb_type: rope
  rope_base: 10000
  norm_type: rms
  ff_type: swiglu
  use_bias: false
  compile_model: true
  use_torch_sdpa: true

optimizer:
  name: adamw
  kwargs: 
    lr: 5e-4
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.01

lr_scheduler:
  name: wsd
  kwargs:
    max_iters: -1  # computed after optim step is known
    warmup_ratio: 0.03
    decay_ratio: 0.15
    min_lr_ratio: 0.1

checkpoint:
  enabled: true
  save_dir: ${..save_dir}
  save_top_k: 5
  save_last: true
  monitor: "val_loss wikipedia_hr" 
  mode: min

early_stopping:
  enabled: false ##########
  monitor: "val_loss wikipedia_hr"  
  mode: min
  patience: 10

wandb:
  enabled: true
  project: 1B-model
  group: str | None = test
  name: test
  log_freq: 2000

trainer:
  max_tokens: 100_000_000_000 # how many tokens to train on
  accelerator: gpu
  precision: bf16-mixed
  devices: -1
  num_nodes: 8
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  strategy: auto
  log_every_n_steps: 100
  val_check_interval: 0.10 # val every x / max_tokens
  limit_val_batches: 10  # int | null
  resume_from: null
  profiler: null

train_dataset:
  paths:
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/classla-web-hr-v1/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/classla-web-hr-v2/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/fineweb-2-hrv/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/riznica/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/classla-web-bs-v1/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/classla-web-bs-v2/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/fineweb-2-bos/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/fineweb-edu-10BT/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/fineweb-hq-20BT/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/macocu-en-hr-sent/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/macocu-bs-en-sent/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/settimes-en-hr-v2/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/settimes-bs-en-v2/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/dgt-en-hr-v2021/tokenized.npy
  weights:
    - 0.039837   # classla-web-hr-v1
    - 0.075147   # classla-web-hr-v2
    - 0.140036   # fineweb-2-hrv
    - 0.002154   # riznica
    - 0.013045   # classla-web-bs-v1
    - 0.025333   # classla-web-bs-v2
    - 0.206148   # fineweb-2-bos
    - 0.160346   # fineweb-edu-10BT
    - 0.328631   # fineweb-hq-20BT
    - 0.005000   # macocu-en-hr-sent
    - 0.000879   # macocu-bs-en-sent
    - 0.000403   # settimes-en-hr-v2
    - 0.000271   # settimes-bs-en-v2
    - 0.002771   # dgt-en-hr-v2021
  seq_len: ${..seq_len}
  shuffle: false
  num_workers: 6
  batch_size: 32 #half from 24 since there will be 8 gpus


val_dataset:
  paths:
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/wikipedia-hr-20231101/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/wikipedia-bs-20231101/tokenized.npy
    - ${paths:DATA_DIR}/processed/1B-model-vocab-48000/wikipedia-en-20231101/tokenized.npy
  names:
    - wikipedia_hr
    - wikipedia_bs
    - wikipedia_en
  seq_len: ${..seq_len}